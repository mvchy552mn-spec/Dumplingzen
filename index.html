	<style>
  :root {
    --vertical-card-height: 330px;
    --horizontal-card-height: 168px;
    --vertical-skeleton-card-height: 308px;
    --horizontal-skeleton-card-height: 168px;
    --title-height: 19px;
    --sustainability-height: 56px;
    --advantage-height: 58px;
    --inner-paddings: 16px;
    --total-vertical-card-height: calc(var(--vertical-card-height) + calc(var(--inner-paddings) * 2));
    --total-horizontal-card-height: calc(var(--horizontal-card-height) + calc(var(--inner-paddings) * 2));
  }

  .product-push__wrapper {
    --additional-height: 24px;
    position: relative;
    width: 100%;
    height: calc(var(--total-vertical-card-height) + var(--additional-height));
  }

  /* Vertical card combinations */
  .product-push__wrapper--with-title {
    --additional-height: var(--title-height);
  }

  .product-push__wrapper--with-sustainability {
    --additional-height: var(--sustainability-height);
  }

  .product-push__wrapper--with-advantage {
    --additional-height: var(--advantage-height);
  }

  .product-push__wrapper--with-title.product-push__wrapper--with-sustainability {
    --additional-height: calc(var(--title-height) + var(--sustainability-height));
  }

  .product-push__wrapper--with-title.product-push__wrapper--with-advantage {
    --additional-height: calc(var(--title-height) + var(--advantage-height));
  }

  .product-push__wrapper--with-sustainability.product-push__wrapper--with-advantage {
    --additional-height: calc(var(--sustainability-height) + var(--advantage-height));
  }

  .product-push__wrapper--with-title.product-push__wrapper--with-sustainability.product-push__wrapper--with-advantage {
    --additional-height: calc(var(--title-height) + var(--sustainability-height) + var(--advantage-height));
  }

  /* Complementary card */
  .product-push__wrapper--complementary {
    height: 387px;
    flex: 1 0 auto;
    margin-bottom: 16px;
  }

  @media (min-width: 736px) {
    .product-push__wrapper--complementary {
      flex-basis: 430px;
      width: 430px;
      margin-bottom: 0;
    }
  }

  /* Horizontal card combinations */
  .product-push__wrapper--horizontal {
    height: var(--total-horizontal-card-height);
  }

  .product-push__wrapper--horizontal.product-push__wrapper--with-title {
    height: calc(var(--total-horizontal-card-height) + var(--title-height));
  }

  .product-push__wrapper--horizontal.product-push__wrapper--with-advantage {
    height: calc(var(--total-horizontal-card-height) + var(--advantage-height));
  }

  .product-push__wrapper--horizontal.product-push__wrapper--with-advantage.product-push__wrapper--with-title {
    height: calc(var(--total-horizontal-card-height) + var(--advantage-height) + var(--title-height));
  }

  /* Skeleton */
  bl-carousel[data-skeleton="true"],
  swiper-container[data-skeleton="true"] {
    opacity: 0;
    transition: opacity 0.3s linear;
  }

  /* Carousel skeleton */
  .carousel-skeleton,
  .carousel-skeleton-recommendation {
    position: absolute;
    left: 0;
    width: 100%;
    overflow: hidden;
    opacity: 1;
    transition: all 0.3s linear;
    background-color: #ffffff;
  }

  .carousel-skeleton-recommendation {
    background-color: #f6f6f6;
    transition: all 3s linear;
  }

  /* Shimmer effect */
  @keyframes shimmer-fade {
    0% {
      opacity: 1;
    }
    50% {
      opacity: 0.3;
    }
    100% {
      opacity: 1;
    }
  }

  .shimmer {
    position: relative;
    background-color: #f6f6f6;
    height: 9px;
    border-radius: 10px;
  }

  .shimmer::after {
    position: absolute;
    border-radius: 10px;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background-color: #dbdbdb;
    animation: shimmer-fade 2s infinite;
    content: '';
  }

  /* Title skeleton */
  .title-skeleton {
    width: 320px;
    margin-top: 5px;
    margin-bottom: 5px;
  }

  .title-skeleton:nth-child(2) {
    margin-top: 10px;
  }

  /* Card wrapper skeleton */
  .card-wrapper-skeleton {
    display: flex;
    flex-direction: row;
    width: 1300px;
    padding-top: 38px;
    padding-bottom: 16px;
  }

  .card-wrapper-skeleton--horizontal {
    padding-top: 16px;
  }

  .product-push__wrapper--complementary .card-wrapper-skeleton {
    padding-top: 30px;
    padding-bottom: 0;
  }

  /* Card skeleton */
  .card-skeleton {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 196px;
    min-width: 196px;
    height: var(--vertical-skeleton-card-height);
    border: 2px solid #dbdbdb;
    border-radius: 10px;
    margin-right: 16px;
    padding: 16px 8px;
    background-color: #fff;
  }

  .product-push__wrapper--with-sustainability .card-skeleton {
    height: calc(var(--vertical-skeleton-card-height) + var(--sustainability-height));
  }

  .card-skeleton--horizontal {
    display: block;
    width: 288px;
    min-width: 288px;
    height: var(--horizontal-skeleton-card-height);
    padding: 16px;
  }

  .product-push__wrapper--with-advantage .card-skeleton {
    margin-bottom: var(--advantage-height);
  }

  .product-push__wrapper--complementary .card-skeleton {
    height: 333px;
    margin-right: 38px;
    padding-top: 40px;
  }

  /* Card inner skeleton */
  .card-inner-skeleton {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    margin-top: 18px;
  }

  /* Card sticker skeleton */
  .card-sticker-skeleton {
    width: 90%;
  }

  .card-skeleton--horizontal .card-sticker-skeleton {
    margin: 0 auto;
  }

  .card-sticker-skeleton div:first-child {
    margin-bottom: 10px;
  }

  .card-skeleton--horizontal .card-sticker-skeleton div:first-child {
    margin-bottom: 8px;
  }

  /* Card image skeleton */
  .card-image-skeleton {
    width: 100px;
    height: 100px;
    margin-top: 8px;
  }

  .card-image-skeleton--sustainability {
    width: 61px;
    height: 48px;
  }

  .card-skeleton--horizontal .card-image-skeleton {
    align-self: center;
    margin-top: 0;
    margin-right: 8px;
    width: 70px;
    height: 70px;
  }

  /* Card right skeleton */
  .card-right-skeleton {
    flex-grow: 1;
    align-self: flex-end;
  }

  /* Card rating skeleton */
  .card-rating-skeleton {
    width: 70px;
    margin-top: 18px;
  }

  .card-skeleton--horizontal .card-rating-skeleton {
    width: 98px;
    margin-top: 21px;
  }

  /* Card label skeleton */
  .card-label-skeleton {
    width: 100%;
    margin-top: 12px;
  }

  .card-skeleton--horizontal .card-label-skeleton {
    margin-top: 0;
  }

  .card-label-skeleton div:first-child {
    margin-bottom: 8px;
  }

  .card-skeleton--horizontal .card-label-skeleton div:last-child {
    width: 70px;
  }

  /* Card bottom skeleton */
  .card-bottom-skeleton {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 31px;
  }

  .card-skeleton--horizontal .card-bottom-skeleton {
    margin-top: 10px;
  }

  /* Card price skeleton */
  .card-price-skeleton--1 {
    width: 90px;
    margin-bottom: 8px;
  }

  .card-price-skeleton--2 {
    width: 108px;
  }

  .card-skeleton--horizontal .card-price-skeleton {
    margin-left: 0;
  }

  /* Card button skeleton */
  .card-button-skeleton {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-left: 31px;
  }

  .card-skeleton--horizontal .card-button-skeleton {
    margin-left: 0;
  }

  .card-button-skeleton.shimmer::after {
    border-radius: 50%;
  }

  .carousel-skeleton-empty-container {
    width: 100%;
    overflow: hidden;
    opacity: 1;
    transition: all 3s linear;
    background-color: #ffffff;
  }

  .billboard-image-skeleton {
    width: 100%;
    height: 260px;
    border-radius: 10px;
    margin-bottom: 15px;
  }

.trends__panel {
  position: relative;
}

.trends__panel[data-skeleton="true"] .trends__list,
.trends__panel[data-skeleton="true"] .trends__list {
  opacity: 0;
  transition: opacity .3s linear;
}

.trends-skeleton {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 1;
  transition: opacity .3s linear;
  pointer-events: none;
}

.trends-skeleton__list {
  display: flex;
  gap: 24px;
  padding: 0 0 16px 0;
}

.trends-skeleton__card {
  width: 226px;
  min-width: 226px;
  height: 314px;
  border: 2px solid #dbdbdb;
  border-radius: 24px;
  padding: 25px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: #fff;
}

.trends-skeleton__media {
  height: 130px;
  width: 130px;
  align-self: center;
  border-radius: 8px;
  margin-bottom: 8px;
}

.trends-skeleton__brand   { height: 17px; width: 40%; margin-top: 12px }
.trends-skeleton__label-1 { height: 12px; width: 95%; margin: 6px 0 0; }
.trends-skeleton__label-2 { height: 12px; width: 75%; margin: 8px 0 0; }

.trends-skeleton__rating  { height: 12px; width: 110px; margin: 12px 0 0; }

.trends-skeleton__strike  { display:flex; align-items:center; gap:8px; margin: 10px 0 0; }
.trends-skeleton__strike > .chip  { height: 12px; width: 34px; }
.trends-skeleton__strike > .old   { height: 12px; width: 70px; }
.trends-skeleton__strike > .badge { height: 18px; width: 38px; border-radius: 6px; }

.trends-skeleton__price   { height: 18px; width: 60%; margin: 12px 0 12px; border-radius: 6px; }

.trends-skeleton .shimmer { border-radius: 8px; }
.trends-skeleton__price.shimmer::after { border-radius: 6px; }
.trends__panel[data-skeleton="false"] .trends-skeleton {
  opacity: 0;
  visibility: hidden;
}
</style>

            const forceCookiesFullDeleteMode = window.G_CONFIG.forceCookiesFullDeleteMode ?? false;

            const PROTECTED_PURPOSES = new Set(['cookieset-Typ2xMZW']);

                const cookie = [
                    name + '=',
                    'expires=Thu, 01 Jan 1970 00:00:01 GMT',
                    'path=' + path,
                ];
                if (domain) {
                    cookie.push('domain=' + domain);
                }
                document.cookie = cookie.join(';');

            const deleteCookieAllDomains = (name) => {
                const domains = (
                    '.#' + document.location.host.replaceAll('.', '#.#')
                ).split('#');

                while (domains.length) {
                    const possibleDomain = domains.join('');
                    deleteCookie(name, possibleDomain);
                    domains.shift();
                }

                deleteCookie(name, '');
            };

            const createCookie = (name, value, months) => {
                const date = new Date();
                date.setMonth(date.getMonth() + months);
                const expires = 'expires=' + date.toUTCString();
                document.cookie = name + '=' + value + '; ' + expires + '; path=/';
            }

            const deleteAllCookiesExcept = (cookiesToPreserve) => {
                document.cookie.split(';').forEach(cookie => {
                    const cookieName = cookie.split('=')[0].trim();

                    const shouldPreserve = cookiesToPreserve.some(preserved => {
                        if (preserved.endsWith('_')) {
                            return cookieName.startsWith(preserved);
                        }
                        return cookieName === preserved;
                    });

                    if (!shouldPreserve) {
                        deleteCookieAllDomains(cookieName);
                    }
                });
            };

                Object.values(didomiStatus.vendors).forEach(vendor => {
                    if (vendor.enabled && !!cookiesByDidomiVendorId[vendor.id] && cookiesByDidomiVendorId[vendor.id].length > 0) {
                        consentedCookies = consentedCookies.concat(cookiesByDidomiVendorId[vendor.id]);

                            .filter(([, v]) => v.enabled)

                        .filter(p => !PROTECTED_PURPOSES.has(p.id))
                        .some(p => !p.enabled);

                    const didRefuseAnyVendor = didomiVendors
                        .filter(v => !protectedDidomiVendorIds.includes(v.id))
                        .some(v => !v.enabled);

                        const didRefuseAllPurposes = didomiPurposes
                            .filter(p => !PROTECTED_PURPOSES.has(p.id))
                            .every(p => !p.enabled);

                        const didRefuseAllVendors = didomiVendors
                            .filter(v => !protectedDidomiVendorIds.includes(v.id))
                            .every(v => !v.enabled);

                        const shouldUseFullMode = forceCookiesFullDeleteMode || didRefuseAllPurposes || didRefuseAllVendors;

                        } else {
                            deleteAllCookiesExcept([

                                ...protectedCookies,

                    callback()
                })
                waitingConsentEvent.length = 0
            }

            function getPcID() {
                const cName = "_pcid="
                const cookies = document.cookie.split(';')

                for (let i = 0; i < cookies.length; i++) {
                    let c = cookies[i].trim()
                    if (c.indexOf(cName) === 0) {
                        try {
                            const pcidValue = JSON.parse(decodeURIComponent(c.substring(cName.length, c.length)))?.browserId;
                            return pcidValue;
                        } catch (error) {
                            console.error("[Flagship] Erreur parsing PCID:", error);
                            return null;
                        }
                    }
                }
                return null
            }

            function waitForPianoCookie() {
                const maxAttempts = 10;
                const delay = 500;
                let attempts = 0;

                return new Promise((resolve) => {
                    function checkCookie() {
                        const pcid = getPcID();

                        if (pcid) {
                            resolve(pcid);
                            return;
                        }

                        if (attempts >= maxAttempts) {
                            console.warn("[Flagship] Cookie Piano non disponible après", maxAttempts, "tentatives - utilisation d'un ID temporaire");
                            const tempId = 'temp_' + Math.random().toString(36).substring(2, 15);

                        attempts++;
                        setTimeout(checkCookie, delay);

            /**

             */
            function sendPianoEvent({ flag, key, forced, value }) {
                const metadata = flag?.metadata || {}
                const campaignId = metadata.campaignId || 'unknown'
                const variationId = metadata.variationId || 'unknown'
                const campaignName = metadata.campaignName || key
                const trafficAllocation =
                    metadata.allocationPercentage || metadata.campaignAllocationPercentage || 100

                const mvCreation = forced
                    ? '[' + variationId + '] ' + (value ? 'Variation' : 'Original')
                    : '[' + variationId + '] ' + (metadata.variationName || 'Original')

                const mvVariation = forced
                    ? value
                        ? 'enabled'
                        : 'disabled'
                    : variationId !== 'unknown' && metadata.variationName !== 'Original'
                        ? 'enabled'
                        : 'disabled'

                const mvTestData = {
                    mv_test: '[' + campaignId + '] ' + campaignName,
                    mv_creation: mvCreation,
                    mv_variation: mvVariation,
                    mv_wave: trafficAllocation,
                    mv_campaign_id: campaignId,
                    mv_variation_id: variationId
                }

                setTimeout(() => {
                    if (window.pa && typeof window.pa.sendEvent === 'function') {
                        window.pa.sendEvent('mv_test.display', mvTestData)
                    } else {
                        console.warn('[Flagship] Piano not available to send event:', key)
                    }
                }, 300)
            }

            /**
             * Helper: Set A/B test cookie
             */
            function setCookie(cookieName, cookieValue, cookieExpirationYears = 1) {
                const expirationDate = new Date();
                expirationDate.setFullYear(expirationDate.getFullYear() + cookieExpirationYears);
                document.cookie = cookieName + '=' + cookieValue + '; path=/; expires=' + expirationDate.toUTCString();
            }

            /**
             * Helper: Delete A/B test cookie
             */
            function deleteCookie(cookieName) {
                document.cookie = cookieName + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            }

            /**
             * Helper: Add CSS class to document
             */
            function addDocumentClass(className) {
                document.documentElement.classList.add(className);
            }

            /**
             * Helper: Remove CSS class from document
             */
            function removeDocumentClass(className) {
                document.documentElement.classList.remove(className);
            }

            /**
             * Helper: Create action function for A/B test variations
             */
            function createActionFunction(classConfig, cookieConfig) {
                return function action(isEnabled) {
                    if (isEnabled) {
                        if (classConfig) {
                            addDocumentClass(classConfig.name);
                        }
                        if (cookieConfig) {
                            setCookie(cookieConfig.name, cookieConfig.value, cookieConfig.expirationYears || 1);
                        }
                    } else {
                        if (classConfig) {
                            removeDocumentClass(classConfig.name);
                            if (classConfig.removeClasses && Array.isArray(classConfig.removeClasses)) {
                                classConfig.removeClasses.forEach(c => removeDocumentClass(c));
                            }
                        }
                        if (cookieConfig) {
                            deleteCookie(cookieConfig.name);
                        }
                    }

                    // Clear pending classes
                    if (classConfig && classConfig.clearClasses && Array.isArray(classConfig.clearClasses)) {
                        classConfig.clearClasses.forEach(c => removeDocumentClass(c));
                    }
                };
            }

            /**
             * Helper: Create cleanup function for A/B test
             */
            function createCleanupFunction(classConfig, cookieConfig, onCleanup) {
                return function cleanup() {
                    if (classConfig) {
                        removeDocumentClass(classConfig.name);
                        if (classConfig.removeClasses && Array.isArray(classConfig.removeClasses)) {
                            classConfig.removeClasses.forEach(c => removeDocumentClass(c));
                        }
                    }
                    if (cookieConfig) {
                        deleteCookie(cookieConfig.name);
                    }
                    // Clear pending classes
                    if (classConfig && classConfig.clearClasses && Array.isArray(classConfig.clearClasses)) {
                        classConfig.clearClasses.forEach(c => removeDocumentClass(c));
                    }
                    onCleanup();
                };
            }

            /**
             * Generic A/B test initialization using Flagship flag (modulaire)
             * Peut gérer optionnellement des cookies et/ou des classes CSS
             * @param {Object} config - Configuration object
             * @param {string} config.flagKey - Flagship flag key
             * @param {function} [config.condition=() => true] - Condition function to check if test should be applied
             * @param {function} [config.onTrack] - Function to execute for tracking when test is applied (receives callback sendTrack)
             * @param {string} [config.testName='A/B test'] - Name for logging purposes
             * @param {Object} [config.cookieConfig] - Cookie configuration (if present, cookie is managed)
             * @param {string} config.cookieConfig.name - Name of the cookie
             * @param {string} config.cookieConfig.value - Value to set when enabled
             * @param {number} [config.cookieConfig.expirationYears=1] - Cookie expiration in years
             * @param {Object} [config.classConfig] - Class configuration (if present, class is managed)
             * @param {string} config.classConfig.name - Name of the CSS class to add/remove
             * @param {string[]} [config.classConfig.removeClasses] - Array of CSS classes to remove when isEnabled = false
             * @param {string[]} [config.classConfig.clearClasses] - Array of CSS classes to always remove (e.g., pending states)
             * @param {function} [config.onCleanup] - Function executed when cleanup occurs
             */
            async function initAbTest(config) {
                try {
                    const {
                        flagKey,
                        condition = () => true,
                        onTrack,
                        testName = 'A/B test',
                        cookieConfig,
                        classConfig,
                        onCleanup = () => {},
                        forcedValue: forcedValueConfig = null
                    } = config;

                    // Create action and cleanup functions from configuration
                    const action = createActionFunction(classConfig, cookieConfig);
                    const cleanup = createCleanupFunction(classConfig, cookieConfig, onCleanup);

                    // Check if flag is forced via URL unless an explicit forced value is provided
                    const urlParams = new URLSearchParams(window.location.search);
                    const forcedValue = forcedValueConfig !== null ? forcedValueConfig : urlParams.get(flagKey);

                    if (!window.fsVisitor) {
                        cleanup();
                        console.warn(`[Flagship] Visitor not available for ` + testName);
                        return { flagKey, applied: false, isEnabled: false, forced: forcedValue !== null };
                    }

                    let isEnabled = false;
                    let flag;

                    // Override value if present in URL or explicit config
                    if (forcedValue !== null) {
                        isEnabled = forcedValue === 'true';
                    } else {
                        flag = window.fsVisitor.getFlag(flagKey);

                        if (!flag.exists()) {
                            console.warn(`[Flagship] Flag '${flagKey}' not found`);
                            cleanup();
                            return { flagKey, applied: false, isEnabled: false, forced: false };
                        }

                        isEnabled = flag.getValue();
                    }

                    const consented = window.fsVisitor.hasConsented;
                    let applied = false;

                    if (condition()) {
                        applied = true;
                        action(isEnabled);

                        // Tracking
                        const sendTrack = () => {
                            sendPianoEvent({ flag: flag, key: flagKey, forced: forcedValue !== null, value: isEnabled });
                        }

                        const track = () => {
                            if (onTrack && typeof onTrack === 'function') {
                                return onTrack({ sendTrack });
                            }
                            return sendTrack();
                        };

                        if (consented) {
                            track();
                        } else {
                            addWaitingConsentEvent({ callback: track });
                        }
                    } else {
                        cleanup();
                    }

                    return { flagKey, applied, isEnabled, forced: forcedValue !== null };

                } catch (error) {
                    console.error(`[Flagship] Error initializing ` + testName + `:`, error);
                    return { flagKey: config.flagKey, applied: false, isEnabled: false, forced: false };
                }
            }

            loadFlagship();

        })
    </script>
